[project]
name = "bannermania-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sergio Rodriguez", email = "sergio@ffactory.io" }  # allowlist pii: intentional package author contact
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.0,<4.0",
    "pillow>=10.2,<12.0",
]

[project.scripts]
bannermania-demo = "bannermania_demo:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # long lines in render code (color tuples, curl examples) are common

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
